  <div class="hero">
    <h1>Use the tools together</h1>
    <p class="tagline">Each Encryption 1™ tool does one job well. When you use them together, you can handle everyday privacy tasks: share a photo without its hidden location, send a sensitive document, protect an account, or check that a file hasn&#039;t changed.</p>
  </div>

  <div class="section">
    <div class="card">
      <p class="why">Your files stay under your control. Each tool works independently in your browser. When you finish one step, save the result and open it in the next tool. Nothing is passed between tools behind the scenes, and your files aren&#039;t uploaded by these tools. Burn is the exception: when you create a Burn link, the content is sent to the service so it can be shared.</p>
    </div>
  </div>

  <div class="section">
    <h2>Six recipes</h2>
    <p style="text-align:center"><em>You don&#039;t need to be a security expert. Just follow the steps.</em></p>
    <div class="card">
      <h3><bdi dir="ltr">1.</bdi> Send a photo without giving away where it was taken</h3>
      <p class="goal">Photos from a phone usually carry the GPS location, the date and the camera model inside the file. Remove those, then share the picture so it can be seen only once.</p>
      <ol class="steps">
        <li>Open the photo in <a href="scrub.html"><bdi>Scrub</bdi></a> and remove its hidden details. Save the clean copy.</li>
        <li>Open <a href="burn.html"><bdi>Burn</bdi></a>, choose the Photo tab and add the clean copy.</li>
        <li>Send the one-time link to the person. Once they have looked at the photo, the link stops working.</li>
      </ol>
      <div class="note">Good to know: if the person says the link is already gone before they opened it, someone else opened it first. That is exactly what a one-time link is for: you find out.</div>
    </div>
    <div class="card">
      <h3><bdi dir="ltr">2.</bdi> Send a sensitive document</h3>
      <p class="goal">A contract, a medical letter or tax papers: lock the file so that only the right person can open it, and give them a way to confirm it arrived unchanged.</p>
      <ol class="steps">
        <li>If it is a Word, Excel, PowerPoint, OpenDocument or PDF file, run it through <a href="scrub.html"><bdi>Scrub</bdi></a> first to remove the author, company and other hidden details.</li>
        <li>Encrypt the clean file with <a href="ec1.html"><bdi>Encryption 1</bdi></a>, using a strong password from <a href="forge.html"><bdi>Forge</bdi></a>.</li>
        <li>Send the encrypted file by email or any file-sharing service. It is unreadable without the password.</li>
        <li>Send the password separately, through <a href="burn.html"><bdi>Burn</bdi></a>, so it can be read once and no copy stays in anyone&#039;s inbox.</li>
        <li>Optional: create a fingerprint of the encrypted file with <a href="fingerprint.html"><bdi>Fingerprint</bdi></a> and send that too. The recipient can compare it to confirm the file is exactly what you sent.</li>
      </ol>
      <div class="note">Good to know: never send the file and its password through the same channel. Splitting them is what protects you.</div>
    </div>
    <div class="card">
      <h3><bdi dir="ltr">3.</bdi> Share a password safely</h3>
      <p class="goal">A Wi-Fi password for a guest, a shared account for a family member, a login for a colleague.</p>
      <ol class="steps">
        <li>Create a strong password or an easy-to-read passphrase with <a href="forge.html"><bdi>Forge</bdi></a>.</li>
        <li>Paste it into <a href="burn.html"><bdi>Burn</bdi></a> and create a one-time link.</li>
        <li>Send the link. The person reads the password once, and then the link is gone.</li>
      </ol>
    </div>
    <div class="card">
      <h3><bdi dir="ltr">4.</bdi> Lock down an important account</h3>
      <p class="goal">A strong password, a second step at login, and a safe place for the backups, without installing anything.</p>
      <ol class="steps">
        <li>Create a long, unique password with <a href="forge.html"><bdi>Forge</bdi></a> and set it on the account.</li>
        <li>Store it in <a href="vault.html"><bdi>Vault</bdi></a>, your own encrypted password file.</li>
        <li>In the account&#039;s security settings, choose the authenticator-app option. When it shows a setup key, paste that key into <a href="token.html"><bdi>Token</bdi></a> and enter the code it gives you back on the account&#039;s screen.</li>
        <li>Save the account&#039;s recovery codes. They fit well in the entry&#039;s Notes in Vault, or on paper.</li>
      </ol>
      <div class="note">Good to know: for your most important accounts (email, banking, the cloud account that holds your Vault file), keep the Token setup key somewhere separate from that account&#039;s password, such as on paper. Otherwise one stolen vault would open both steps.</div>
    </div>
    <div class="card">
      <h3><bdi dir="ltr">5.</bdi> Review a contract and keep proof of the signed copy</h3>
      <p class="goal">Read the risky parts before you sign, then keep a copy you can later show has not been altered.</p>
      <ol class="steps">
        <li>Paste the text of the contract or terms of service into <a href="clarify.html"><bdi>Clarify</bdi></a>. It highlights clauses that often deserve a closer look, such as automatic renewal or limits on liability.</li>
        <li>After signing, create a fingerprint of the signed file with <a href="fingerprint.html"><bdi>Fingerprint</bdi></a> and keep the certificate.</li>
        <li>Store the file itself with <a href="ec1.html"><bdi>Encryption 1</bdi></a>. Years later, a new fingerprint that matches the first one shows the file has not changed.</li>
      </ol>
      <div class="note">Good to know: Clarify points out wording to look at. It is not legal advice, and it does not replace a lawyer for anything important.</div>
    </div>
    <div class="card">
      <h3><bdi dir="ltr">6.</bdi> Back up important files and know they are still intact</h3>
      <p class="goal">Photos, scanned papers or work files you cannot afford to lose or have quietly damaged.</p>
      <ol class="steps">
        <li>Lock the files with <a href="ec1-multi.html"><bdi>Multi-File</bdi></a> so the backup is private wherever it is kept, whether on a USB drive or in a cloud folder.</li>
        <li>Create fingerprints of the backup files with <a href="fingerprint.html"><bdi>Fingerprint</bdi></a> and keep them in a separate place.</li>
        <li>Every so often, fingerprint the backup again. If the new fingerprint matches, nothing has changed; if it differs, the file was damaged and you should restore it from another copy.</li>
      </ol>
    </div>
  </div>
